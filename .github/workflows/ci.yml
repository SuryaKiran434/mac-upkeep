name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Every job in this workflow only reads the
# repository -- checkout, dependency install, lint/test and artifact upload all
# work fine with `contents: read`. A job that ever needs to write (push a commit,
# comment on a PR, cut a release) must request that scope on itself rather than
# widening this block.
permissions:
  contents: read

jobs:
  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud needs the full history to attribute code to authors and
          # to work out what counts as "new code"; a shallow clone breaks both.
          fetch-depth: 0

      - name: Syntax check every script
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if bash -n "$f"; then echo "ok    $f"; else echo "FAIL  $f"; fail=1; fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $fail

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # -S warning: style/info notes are advisory on a mature script and
          # would turn this job red on day one for no correctness gain.
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -S warning -e SC1091

      # Analysis only. There is no test suite here and SonarCloud has no shell
      # coverage importer, so nothing is imported as coverage -- see
      # sonar-project.properties. Runs after ShellCheck, which remains the
      # sharper of the two tools for shell: Sonar ships ~40 shell rules and most
      # of what it reports on this repo is style (prefer "[[" over "[").
      #
      # Analysis is advisory, not a gate: continue-on-error keeps a SonarCloud
      # outage or a scanner hiccup from failing the required check.
      #
      # Pinned to a commit SHA rather than the moving v6 tag. This repo is the
      # one in this batch whose sonar.sources covers .github/, so Sonar analyses
      # this workflow and flags an unpinned action reference (githubactions:S7637)
      # as a supply-chain vulnerability -- correctly: a moving tag can be
      # repointed at any commit. Dependabot tracks github-actions weekly here and
      # updates SHA pins along with the comment.
      - name: SonarCloud analysis
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
