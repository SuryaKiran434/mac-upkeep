# SonarCloud configuration for CI-based analysis.
#
# Automatic Analysis is switched off across these projects so that CI-based
# analysis can import test coverage. This repository has no test suite and no
# coverage of any kind -- SonarCloud has no shell coverage importer at all --
# so this configuration exists purely so the project keeps getting analysed.
# See the pull request for what that analysis is and is not worth here.

# The key deliberately keeps the repository's former name (BrewAutomation).
# A SonarCloud project key is immutable: changing it here does not rename the
# project, it creates a second one with no history while the original lingers.
# The key is opaque and nothing user-facing reads it, so the stale name is the
# cheaper of the two wrong options. Renaming for real means creating the new
# project in SonarCloud first and accepting the loss of past analyses.
sonar.projectKey=SuryaKiran434_BrewAutomation
sonar.organization=suryakiran434

# The repository root. Everything analysable lives at the top level: the shell
# scripts, notify.py, and the workflow YAML under .github/. This reproduces the
# same file set the previous automatic analysis indexed, so the project's
# history stays comparable.
sonar.sources=.

# sonar.tests is intentionally absent: there is no test suite, and naming a
# directory that does not exist makes the scanner fail. No coverage report path
# is set either -- none is produced, and SonarCloud has no shell coverage
# importer even if one were.
#
# SonarCloud nonetheless reports this project at 0.0% coverage, verified on the
# first CI run. That figure is about notify.py and nothing else: Python is the
# only coverage-capable language here, the zero-coverage sensor marks an
# unreported Python file as 0%, and notify.py genuinely has no tests. The shell
# scripts -- 581 of the 729 analysed lines -- contribute nothing to that number
# in either direction. Read it as "the one testable file is untested", not as a
# coverage figure for the repository.

# The launchd property lists are configuration data, not source, and the docs
# add nothing to the analysis.
sonar.exclusions=**/*.plist,**/*.md,LICENSE

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
